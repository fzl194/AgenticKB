# CoreMasterKB 一体化部署配置
#
# 使用方法：
#   docker compose up -d            # 启动服务
#   docker compose logs -f          # 持续查看服务日志
#   docker compose exec app bash    # 进入应用容器
#   docker compose down             # 停止并删除服务容器
#
# 如果服务器不支持 Docker Compose V2，
# 请将命令中的 "docker compose" 替换为 "docker-compose"。

services:
  app:
    # 镜像来源：
    # 本地环境通过源代码构建镜像。
    build:
      context: .
      dockerfile: docker/Dockerfile

    # 服务器部署时，使用从 cmkb.tar 加载的镜像。
    image: coremasterkb-app:latest

    # 容器名称
    container_name: cmkb

    # deploy-server.sh 会将 CMKB_ORDERED_STARTUP 设置为 1。
    # 此时 Supervisor 启动后，所有子服务默认先保持停止状态，
    # 部署脚本会在依赖检查通过后，再按顺序启动各个子服务。
    #
    # 如果直接执行 docker compose up，
    # 则保留镜像中原本的自动启动行为。
    command:
      - /bin/bash
      - -c
      - |
        if printenv CMKB_ORDERED_STARTUP | grep -qx '1'; then
          sed -i 's/^autostart=true/autostart=false/' /etc/supervisor/conf.d/cmkb.conf
        fi
        exec /usr/bin/supervisord -c /etc/supervisor/supervisord.conf -n

    # 宿主机端口与容器端口映射
    ports:
      - "${CMKB_UI_PORT:-8080}:80"         # Nginx，对外提供知识库前端页面
      - "127.0.0.1:${CMKB_LLM_PORT:-8900}:8900"      # 大模型服务 llm_service
      - "127.0.0.1:${CMKB_MINING_PORT:-8901}:8901"   # 知识挖掘服务 knowledge_mining
      - "127.0.0.1:${CMKB_CONTROL_PORT:-8910}:8910"  # 主控服务 main_control_service
      - "127.0.0.1:${CMKB_SERVING_PORT:-8081}:8081"  # 在线检索服务 agent_serving_java
      - "127.0.0.1:${CMKB_MCP_PORT:-9000}:9000"      # MCP 服务 mcp_server

    volumes:
      # Docker 命名卷，用于持久化上传文件。
      - uploads:/app/uploads

      # Docker 命名卷，用于持久化主控服务数据。
      - control_data:/app/data

      # 将服务器宿主机上的代码和配置目录挂载到容器内。
      #
      # 本地仅测试镜像内置代码时，可以注释掉下面这些挂载项。
      #
      # 修改这些宿主机文件后，可执行以下命令应用配置：
      # bash deploy-server.sh --apply-config
      # 各服务日志（按服务分文件，supervisor 负责轮转）。
      # 挂到宿主机是为了：容器重建后日志不丢，且能直接 tail / grep / scp。
      - ./logs:/app/logs

      - ./knowledge_mining:/app/knowledge_mining
      - ./llm_service:/app/llm_service
      - ./main_control_service:/app/main_control_service
      - ./mcp_server:/app/mcp_server
      - ./databases:/app/databases

    environment:
      # Authentication secrets are injected at deploy time and never committed.
      CMKB_JWT_SECRET: "${CMKB_JWT_SECRET:-}"
      CMKB_INTERNAL_VERIFY_SECRET: "${CMKB_INTERNAL_VERIFY_SECRET:-}"
      CMKB_BOOTSTRAP_ADMIN_PASSWORD: "${CMKB_BOOTSTRAP_ADMIN_PASSWORD:-}"
      CMKB_CORS_ORIGINS: "${CMKB_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"

      # 是否启用按依赖顺序启动服务。
      # 0：使用 Supervisor 默认自动启动行为。
      # 1：先停止所有子服务，再由部署脚本按顺序启动。
      CMKB_ORDERED_STARTUP: "${CMKB_ORDERED_STARTUP:-0}"

      # 主控服务配置目录
      MAIN_CONTROL_CONFIG_DIR: /app/main_control_service/config

      # 领域注册配置文件路径
      DOMAIN_REGISTRY_PATH: /app/main_control_service/config/domain_registry.yaml

      # 场景包配置目录
      SCENARIO_PACKS_DIR: /app/main_control_service/config/scenario_packs

    # 加入 CoreMasterKB 专用 Docker 网络
    networks:
      - cmkb_net

    # 保持标准输入开启，方便交互式操作。
    stdin_open: true

    # 为容器分配伪终端。
    tty: true

    # 容器异常退出或 Docker 重启后自动拉起；
    # 手动停止的容器不会自动重启。
    restart: unless-stopped

    # 容器日志轮转。
    # 6 个子服务的 stdout 都汇到 PID 1，由 Docker 的 json-file 驱动接收。
    # json-file 默认不轮转，长期运行会把宿主机磁盘写满，因此必须显式限制：
    # 单文件 50MB × 保留 5 份 = 该容器日志最多占用 250MB。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

# Docker 命名卷定义
volumes:
  # 上传文件持久化卷
  uploads:

  # 主控服务数据持久化卷
  control_data:

# Docker 网络定义
networks:
  cmkb_net:
    # 实际创建的 Docker 网络名称。
    # 可以通过 CMKB_DOCKER_NETWORK 环境变量覆盖。
    name: ${CMKB_DOCKER_NETWORK:-cmkb_net}

    # 使用桥接网络模式
    driver: bridge

    # 自定义容器网络地址范围
    ipam:
      config:
        # 默认使用 172.30.30.0/24 网段。
        # 可以通过 CMKB_DOCKER_SUBNET 环境变量覆盖。
        - subnet: ${CMKB_DOCKER_SUBNET:-172.30.30.0/24}
