[supervisord]
nodaemon=true
# 日志落在 /app/logs（宿主机 ./logs 挂载进来），按服务分文件、supervisor 自带轮转。
# 这里记录的是进程生命周期事件（spawned / exited / 意外重启），
# 排查"服务是不是挂了、重启了几次"看这个文件。
logfile=/app/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5

# ── Startup order (priority: lower number = starts first) ──
# Priority 10: main_control_service (config center — must be first)
# Priority 20: llm_service (needs config from control)
# Priority 30: mining + serving (need llm_service)
# Priority 40: nginx + mcp (reverse proxy, no backend deps)

# ── 日志约定 ──
# 每个 program 写自己的 /app/logs/<name>.log，50MB × 5 份，由 supervisor 负责轮转
# —— 容器里没有 cron，logrotate 永远不会运行，所以只能用 supervisor 内建能力。
# redirect_stderr=true 把 stderr 并进同一个文件，省得两处对照着看。
# 代价：日志不再进容器 stdout，`docker compose logs` 会基本为空，改用 ./logs/ 下的文件。

[program:control]
command=python -m main_control_service.main
directory=/app
environment=MAIN_CONTROL_HOST="0.0.0.0",MAIN_CONTROL_PORT="8910",MAIN_CONTROL_DB_PATH="/app/data/main_control_service/control_plane.db"
autostart=true
autorestart=true
priority=10
startsecs=3
stdout_logfile=/app/logs/control.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true

[program:llm_service]
command=python -m llm_service
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/app/logs/llm_service.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true

[program:mining]
command=python -m knowledge_mining.mining.api
directory=/app
environment=MINING_API_PORT="8901"
autostart=true
autorestart=true
priority=30
startsecs=3
stdout_logfile=/app/logs/mining.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true

[program:serving]
; jar 走 /app/runtime bind-mount（宿主机 ./runtime）：
; deploy-sync.sh 换宿主机文件后 supervisorctl restart serving 即生效，无需重建容器。
command=java -jar /app/runtime/agent_serving.jar
directory=/app
; 配置来源：serving 启动时从 main_control(8910) 拉 GET /api/v1/serving-config。
; SCENARIO_PACKS_DIR / DOMAIN_REGISTRY_PATH 只是 main_control 不可达时的兜底，
; 指向它所拥有的同一份文件——main_control_service/config 是域配置的唯一真相源。
; 历史上根目录另有一份副本，字段结构不同且已分叉——已删除，勿恢复。
environment=SERVING_MAIN_CONTROL_BASEURL="http://localhost:8910",SCENARIO_PACKS_DIR="/app/main_control_service/config/scenario_packs",DOMAIN_REGISTRY_PATH="/app/main_control_service/config/domain_registry.yaml"
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/app/logs/serving.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true

[program:mcp]
command=python -m mcp_server --transport streamable-http --port 9000
directory=/app
environment=SERVING_URL="http://localhost:8081"
autostart=true
autorestart=true
priority=40
stdout_logfile=/app/logs/mcp.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
; nginx 在 docker/nginx.conf 里被改成写 /dev/stdout 与 /dev/stderr，
; 于是它的访问/错误日志也经 supervisor 落到这里，共用同一套轮转。
; 否则它按 Debian 默认写 /var/log/nginx/*.log —— 那既不受轮转管辖
; （容器无 cron），docker logs 也看不到。
stdout_logfile=/app/logs/nginx.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true
