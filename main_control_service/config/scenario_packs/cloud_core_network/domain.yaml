# Scenario pack（2026-09-01 精简：对齐 v2 算子链）
#
# 实体/本体线（ontology 分区、mining.llm_templates 实体与篇章理解模板）与旧检索
# 引擎（serving.route_policy 通道权重、query_understanding）已随产品线下线——
# 相关配置删除。当前各配置面的真相源：
#   - 挖掘链与参数：挖掘范式模板（mining workflow templates，四套官方预置）
#   - 挖掘 LLM 提示词：knowledge_mining/mining/retrieval_projection/llm_generation.py
#     （doc2query / 层级摘要；版本冻结进 provenance）
#   - LLM provider/model：main_control_service/config/system/llm_service.yaml
#   - 检索管线：检索范式 DAG（范式编辑器/官方预置）
# 本文件保留：display_name（域显示名）与 eval_questions（质量评估问题集，
# 批次9 质量评估套件消费）。
