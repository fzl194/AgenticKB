# Scenario pack for the vendor_tech_docs domain.
# 对齐 D:\MyProjects\tech-kb：华为数通 / 园区 / 路由 / WLAN 厂商技术文档
# （CloudEngine / NetEngine / AirEngine / iMaster NCE 等产品手册与 TechNotes）。
#
# Structure: ontology (shared) + mining (Mining reads this) + serving (Serving reads this)

display_name: "Vendor Tech Docs"

# ===========================================================================
# ONTOLOGY — aligned with tech-kb entity layer (product + knowledge axes)
# ===========================================================================

ontology:
  entity_types:
    - device_series
    - device_model
    - feature
    - command
    - parameter
    - alarm_code
    - protocol
    - board
    - optical_module
    - controller
    - solution
    - software_version
    - concept

  strong_entity_types:
    - device_series
    - device_model
    - feature
    - command
    - alarm_code

# ===========================================================================
# MINING — product-manual mining pipeline
# 推荐创建 Workflow 时选用模板 vendor_tech_docs_full（或种子范式「厂商技术文档全量」）；
# 系统默认 system-full-baseline 仍为全局 FULL，本 pack 不覆盖它。
# ===========================================================================

mining:
  semantic_roles:
    - concept
    - parameter
    - example
    - note
    - procedure_step
    - troubleshooting_step
    - constraint
    - alarm
    - checklist

  # Aligned with tech-kb sources.doc_type / section_category vocabulary
  document_types:
    - product_manual
    - hw_install
    - config_guide
    - cmd_ref
    - alarm_ref
    - troubleshooting
    - release_notes
    - migration_guide
    - solution_guide
    - technical_note
    - datasheet
    - programming_guide
    - security_hardening
    - reference
    - other

  role_keyword_rules:
    - keywords: ["产品介绍", "Product Description", "Overview", "What Is", "Get to Know"]
      role: concept
    - keywords: ["配置", "Configuration", "配置示例", "Typical Configuration"]
      role: procedure_step
    - keywords: ["命令", "Command Reference", "CLI", "display "]
      role: parameter
    - keywords: ["故障", "Troubleshooting", "告警", "Alarm", "排查"]
      role: troubleshooting_step
    - keywords: ["安装", "Installation", "上架", "Hardware"]
      role: procedure_step
    - keywords: ["注意", "Caution", "Note", "限制", "约束"]
      role: constraint

  heading_role_keywords: []

  extractor_rules:
    - name: device_series
      pattern: "\\b(CE\\d{4,5}(?:E)?|XH\\d{4,5}|NE\\d{4,5}(?:E)?|S\\d{4,5}(?:[A-Z]+)?|AirEngine(?:\\s*X?\\d{3,4})?|AC\\d{4}S?)\\b"
      entity_type: device_series
    - name: feature_acronym
      pattern: "\\b(M-LAG|VXLAN|EVPN|BGP|OSPF|IS-IS|BFD|VRRP|Stack|CSS|TRILL|SRv6|NetStream|sFlow|CAPWAP|OFDMA|MU-MIMO)\\b"
      entity_type: feature
    - name: optical_module
      pattern: "\\b(SFP\\+?|SFP28|QSFP\\+?|QSFP28|QSFP56|QSFP-DD|OSFP|CFP2?)\\b"
      entity_type: optical_module
    - name: software_version
      pattern: "\\bV\\d{3}R\\d{3}C\\d{2}(?:SPC\\d+)?\\b"
      entity_type: software_version
    - name: alarm_code
      pattern: "\\b(?:ALM|ALARM)?[-_]?\\d{1,6}\\b"
      entity_type: alarm_code

  parameter_column_names:
    - 参数
    - 参数名称
    - Parameter
    - Value
    - 取值
    - 默认值
    - Default
    - 单位
    - Unit
    - 说明
    - Description

  # VRP / enterprise CLI style (display / system-view chapters)
  section_title_command_pattern: "(?i)^(display|undo|reset|ping|tracert|save)\\s+(\\S+)"

  retrieval_policy:
    raw_text: primary
    generated_question: auxiliary
    entity_card: "off"
    table_row: "structured_tables"
    max_questions_per_segment: 1
    max_entity_cards_per_segment: 0
    # vendor 开 contextual：写入 contextual_text 单元；其它域 pack 仍为 off，不串扰。
    contextual_retrieval: "on"
    min_confidence: 0.5
    max_distance: 5
    discourse_window_size: 15
    min_questionworthy_tokens: 50
    not_questionworthy_roles:
      - navigation
      - toc
      - metadata
    min_chunk_tokens: 128
    max_chunk_tokens: 512
    cross_section_merge: true
    min_enrich_tokens: 30
    structural_context_mode: breadcrumb

  llm_templates:
    # 须与代码提交的键一致（retrieval_units 提交 mining-question-gen），否则静默失效。
    - template_key: mining-question-gen
      template_version: "4"
      purpose: "从段落内容生成假设性检索问题"
      system_prompt: "你是厂商技术文档知识库的检索优化助手。你判断数通交换机、路由器、WLAN、控制器产品手册与 TechNotes 段落是否值得生成问题，如果是则生成高质量检索问题。"
      user_prompt_template: >
        分析以下技术文档段落：

        段落标题：$title
        段落内容：$content

        首先评估该段落是否包含值得生成问题的实质性知识：
        - 如果是目录、导航列表、纯链接/锚点列表：输出 {"questions": []}
        - 如果是大量空值或占位符的稀疏表格：输出 {"questions": []}
        - 如果内容过于简短或模糊，无法生成有意义的问题：输出 {"questions": []}

        如果段落确实包含实质性知识，生成 1 个高质量检索问题：
        - 问题必须能从该段落中找到明确答案
        - 问题应测试知识理解，而非导航（避免"在哪里找到X"、"文档有哪些章节"）
        - 问题应覆盖该段落最核心的知识点
        - 避免生成高度相似或近义的问题：如果该段落的核心概念已经可以从标题直接推断（如标题是"M-LAG 配置"），则生成一个更深入的具体问题（如"配置 M-LAG 时 peer-link 与 DFS 组分别解决什么问题？"）而非表面的概念问题

        **⚠️ 问题质量要求（必须遵守）**：
        - 问题应需要分析、推理或综合理解，而非仅从文中提取单个名词或数字
        - 不要生成答案仅为一个型号名、命令名或单个参数值的问题（如"该段落提到了哪个型号？"→答案只是"CE6850"）
        - 不要生成仅复述段落内容的问题（如"VXLAN 有哪些组件？"→答案就是罗列组件）
        - 优先生成"如何"、"为什么"、"在什么条件下"、"有什么区别"、"升级时要注意什么"类型的问题
        - 如果段落主要是端口规格或光模块兼容性罗列表格，不要对每一行都生成问题

        **好问题示例**：
        ✅ "CE8850 前后通风与后前通风机箱在部署时分别有什么约束？" — 需要理解硬件与散热约束
        ✅ "OSPF stub area 在指定 VRP 版本下如何配置，与 totally stub 有何区别？" — 需要对比配置差异
        ✅ "AP 上电后无法注册到 WLAN AC 时应如何区分 CAPWAP、证书和版本不匹配问题？" — 需要综合排障逻辑

        **差问题示例（不要生成）**：
        ❌ "该段落提到了哪个设备系列？" — 答案通常只是单个系列名
        ❌ "默认定时器是多少秒？" — 答案只是单个参数值
        ❌ "CloudEngine 支持哪些特性？" — 过于宽泛，几乎复述列表内容

        输出一个 JSON 对象，包含 questions 字段（字符串数组）。

        **⚠️ 输出格式要求（必须严格遵守）**：
        - 必须输出 JSON 对象，以 { 开头，以 } 结尾
        - questions 字段的值是字符串数组，每个元素直接是问题文本
        - 无合适问题时 questions 为空数组：{"questions": []}
        - 禁止输出 JSON Schema 定义
        - 正确示例：{"questions": ["配置 M-LAG 时 peer-link 与 DFS 组分别解决什么问题？"]}
        - 空结果示例：{"questions": []}
        - 错误示例：{"questions": [{"question": "..."}]}（不需要嵌套对象）
        - 错误示例：{"type": "array", "items": ...}（这是 Schema 定义，不是数据）
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"questions":{"type":"array","items":{"type":"string"}}},"required":["questions"],"additionalProperties":false}'

    - template_key: mining-segment-understanding
      template_version: "4"
      purpose: "分类语义角色、评估内容质量"
      system_prompt: "你是厂商技术文档知识库的内容理解助手。分析数通/园区/路由/WLAN 产品手册、配置指南、告警参考和 TechNotes 段落，分类语义角色，并评估内容质量。"
      user_prompt_template: >
        分析以下技术文档段落：

        段落标题：$section_title
        内容类型：$block_type
        段落内容：$text

        输出 JSON 对象，包含：

        - semantic_role: 语义角色，根据内容实质选择最匹配的角色：
          - concept: 概念定义、功能描述、架构概述、特性介绍、产品定位
          - parameter: 参数说明、配置项描述、CLI 命令参数、取值范围
          - example: 使用示例、典型配置示例、命令脚本
          - note: 补充说明、注意事项、参考链接
          - procedure_step: 操作步骤、安装上架、配置流程、升级迁移步骤
          - troubleshooting_step: 故障排查步骤、错误处理、已知问题处理
          - constraint: 限制条件、前置要求、兼容性约束、安全加固要求
          - alarm: 告警/日志码说明与处理建议
          - checklist: 检查清单、验收项
          **重要：不要使用 unknown。每个段落都必须根据内容选择一个具体的角色。**
          **heading 类型分段：如果该标题下讨论的是概念/功能，使用 concept；如果是流程/步骤，使用 procedure_step；如果是参考资料，使用 note。**
          **命令参考段落：参数表用 parameter；完整配置过程用 procedure_step 或 example。**
          **纯列表段落：如果列表描述的是组成/功能/特性，使用 concept；如果是操作步骤，使用 procedure_step。**

        - document_type: 文档类型提示（product_manual/hw_install/config_guide/cmd_ref/alarm_ref/troubleshooting/release_notes/migration_guide/solution_guide/technical_note/datasheet/programming_guide/security_hardening/reference/other）
        - content_assessment: 内容质量评估
          - is_substantive: 是否包含实质性知识内容（非纯导航、目录、链接列表）
          - is_navigation: 是否是导航/目录内容
          - assessment_reason: 一句话说明判断依据

        内容质量评估指引：
        - 如果段落只是锚点列表、目录索引、纯链接，is_substantive=false, is_navigation=true
        - 如果段落包含具体的技术描述、参数说明、操作步骤，is_substantive=true
        - 稀疏表格（大量空值或占位符"-"）视为非实质性内容
        - 纯标题无内容视为非实质性内容

        输出示例（仅供参考格式，请根据实际内容生成）：
        {"semantic_role": "concept", "document_type": "config_guide", "content_assessment": {"is_substantive": true, "is_navigation": false, "assessment_reason": "包含 M-LAG 工作原理与关键组件说明"}}
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"entities":{"type":"array","items":{"type":"object","properties":{"type":{"type":"string"},"name":{"type":"string"}},"required":["type","name"],"additionalProperties":false}},"semantic_role":{"type":"string"},"document_type":{"type":"string"},"content_assessment":{"type":"object","properties":{"is_substantive":{"type":"boolean"},"is_navigation":{"type":"boolean"},"assessment_reason":{"type":"string"}},"required":["is_substantive","is_navigation"],"additionalProperties":false}},"required":["entities","semantic_role","document_type","content_assessment"],"additionalProperties":false}'

    - template_key: mining-discourse-relation
      template_version: "2"
      purpose: "分析段落间的语篇关系（RST修辞结构理论）"
      system_prompt: "你是厂商技术文档的语篇关系分析专家。分析产品手册、配置指南、排障与升级类段落之间的修辞关系，要尽可能识别出不同类型的关系。"
      user_prompt_template: >
        分析以下编号段落之间的语篇关系：

        $segments

        对每对有语义关联的段落，判断其修辞关系。可选关系类型（请尽量使用多样化的关系类型）：
        - ELABORATES: 后文详细阐述前文的概念或描述（如：先定义 M-LAG，再详述 peer-link）
        - EVIDENCES: 后文提供证据或数据支持前文的论断
        - CAUSES: 前文所述操作或事件导致了后文的结果（如：版本不匹配导致 AP 注册失败）
        - RESULTS_IN: 前文是原因，后文是其产生的结果（如：配置错误→业务中断）
        - BACKGROUNDS: 后文提供理解前文所需的背景知识或上下文
        - CONDITIONS: 后文说明前文操作的前提条件或触发条件
        - SUMMARIZES: 后文对前文内容进行概括总结
        - JUSTIFIES: 后文解释前文设计决策或操作的理由
        - ENABLES: 后文描述使前文操作成为可能的机制或能力（如：EVPN 使 VXLAN 控制面成为可能）
        - CONTRASTS_WITH: 前后文描述不同方案、模式或选项的对比（如：Spine-Leaf vs 传统三层）
        - PARALLELS: 前后文描述并列的功能或流程（如：不同特性模块的配置章节）
        - SEQUENCES: 后文是前文的后续步骤或时间上的后续事件（如：安装→上电→初始配置）
        - UNRELATED: 无明显关系

        **关系识别指引**：
        - 仔细分析每对段落的语义关系，不要默认使用 ELABORATES
        - 因果关系：检查是否存在"A导致B"的逻辑（使用 CAUSES 或 RESULTS_IN）
        - 对比关系：检查是否在描述不同的方案或选项（使用 CONTRASTS_WITH）
        - 条件关系：检查是否描述前提条件（使用 CONDITIONS）
        - 使能关系：检查是否描述使某个功能成为可能的机制（使用 ENABLES）
        - 并列关系：检查是否描述同一层级的不同功能（使用 PARALLELS）
        - 顺序关系：检查是否是流程中的先后步骤（使用 SEQUENCES）
        - 目标：生成的关系统计中至少应包含 4 种以上的关系类型

        **⚠️ 常见误标警告（务必避免）**：
        - ❌ 两个段落描述不同特性模块（如"BFD 配置"和"VRRP 配置"）不是 CONTRASTS_WITH，应该是 PARALLELS
        - ❌ "参考规范列表"不是前文内容的 EVIDENCES。参考规范是文献引用，不是数据/实验证据
        - ❌ 如果两个段落只是不同的主题（如"光模块规格"和"风扇模块"）且无对比意图，不要标 CONTRASTS_WITH

        输出一个 JSON 对象，包含 relations 字段（数组）。每个 relations 元素包含：
        - source: 源段落编号（整数）
        - target: 目标段落编号（整数）
        - relation: 关系类型（大写）
        - confidence: 置信度（0.0-1.0）

        只输出有明确关系的段落对，跳过 UNRELATED 的。

        **⚠️ 输出格式要求（必须严格遵守）**：
        - 必须输出 JSON 对象，以 { 开头，以 } 结尾
        - relations 字段的值是数组，每个元素是一条关系
        - 无关系时 relations 为空数组：{"relations": []}
        - 禁止输出 JSON Schema 定义或格式说明
        - 正确示例：{"relations": [{"source": 0, "target": 1, "relation": "ELABORATES", "confidence": 0.9}, {"source": 1, "target": 4, "relation": "SEQUENCES", "confidence": 0.85}]}
        - 空结果示例：{"relations": []}
        - 错误示例：[{"source": 0, ...}]（这是数组，不是对象）
        - 错误示例：{"type": "array", "items": ...}（这是 Schema 定义，不是数据）
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"relations":{"type":"array","items":{"type":"object","properties":{"source":{"type":"integer"},"target":{"type":"integer"},"relation":{"type":"string"},"confidence":{"type":"number","minimum":0.0,"maximum":1.0}},"required":["source","target","relation","confidence"],"additionalProperties":false}}},"required":["relations"],"additionalProperties":false}'

    - template_key: mining-contextual-retrieval
      template_version: "2"
      purpose: "为每个段落生成上下文描述，增强检索效果"
      system_prompt: "你是厂商技术文档的检索上下文定位助手。"
      user_prompt_template: >
        文档全文：
        $document

        段落内容：
        $segment

        请生成一句 20-40 字的中文上下文标签，说明该段落在文档中的位置和主题。
        不要复述段落内容，只补充从段落文本中无法直接看出的上下文信息（如所属产品系列、软件版本、章节类型等）。
        输出 JSON 对象，包含 context 字段。

        输出示例（仅供参考格式，请根据实际内容生成）：
        {"context": "该段落位于 CE6800 配置指南的 VXLAN 章节，讨论分布式网关部署"}
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"context":{"type":"string"}},"required":["context"],"additionalProperties":false}'

    # 代码 entity_extract 提交键为 mining-entity-extraction；缺模板则 LLM 通道静默 noop（仅剩 extractor_rules）。
    # 仅写在 vendor pack；其它域不声明 → 行为不变。
    - template_key: mining-entity-extraction
      template_version: "1"
      purpose: "从厂商技术文档段落抽取已知类型实体与清单外重要概念"
      system_prompt: >
        你是厂商技术文档知识库的实体抽取助手。只依据给定文本抽取实体；
        优先归入 allowed_types（如 device_series、device_model、feature、command、
        alarm_code、software_version、protocol、optical_module 等）。
        无法可靠归类但确实重要的概念放入 out_of_schema，不要臆造事实。
        只输出一个 JSON 对象，不要 markdown。
      user_prompt_template: >
        段落正文：$text
        段落标题：$section_title
        块类型：$block_type
        允许的实体类型：$allowed_types

        请输出：
        - entities: 能归入允许类型的实体数组，每项含 type、name，可选 confidence(0-1)
        - out_of_schema: 清单外重要概念数组，每项含 name，可选 proposed_type、reason、evidence

        规则：
        - 名称必须在正文或标题中出现（含缩写）
        - 不要输出纯导航/目录噪声
        - 无实体时：{"entities":[],"out_of_schema":[]}

        **⚠️ 输出格式（必须严格遵守）**：
        - 必须输出 JSON 对象，以 { 开头，以 } 结尾
        - 正确示例：{"entities":[{"type":"feature","name":"M-LAG","confidence":0.9}],"out_of_schema":[]}
        - 空结果：{"entities":[],"out_of_schema":[]}
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"entities":{"type":"array","items":{"type":"object","properties":{"type":{"type":"string"},"name":{"type":"string"},"confidence":{"type":"number","minimum":0.0,"maximum":1.0}},"required":["type","name"],"additionalProperties":false}},"out_of_schema":{"type":"array","items":{"type":"object","properties":{"name":{"type":"string"},"proposed_type":{"type":"string"},"reason":{"type":"string"},"evidence":{"type":"string"}},"required":["name"],"additionalProperties":false}}},"required":["entities","out_of_schema"],"additionalProperties":false}'

    # 仅 vendor pack 注册；其它域无此模板 → entity_fact_extract 提交失败并静默 noop。
    - template_key: mining-entity-fact
      template_version: "1"
      purpose: "从段落证据为已提及实体抽取结构化属性事实"
      system_prompt: >
        你是厂商技术文档知识库的精确事实抽取助手。根据给定段落与实体列表，
        抽取段落中直接陈述的结构化属性事实。禁止臆造、推理或用训练知识补全。
        只输出一个 JSON 对象，不要 markdown。
      user_prompt_template: >
        段落标题：$section_title

        已识别实体（JSON 数组，含 name/type）：
        $entities

        段落正文：
        $text

        请为上述实体抽取段落中**字面出现**的属性事实。每条事实包含：
        - entity: 实体名称（必须来自实体列表或段落中的同义写法对应到列表项）
        - entity_type: 实体类型（尽量与列表一致）
        - attribute: 属性名（英文 snake_case，如 cooling、max_power_w、default_timer_s、supported_feature）
        - value: 属性值（字符串；数值保留原文单位）
        - evidence: 支撑该事实的原文短摘录（必须能在段落中找到）
        - confidence: 0.0-1.0

        规则：
        - 没有字面证据则不要输出该事实
        - 不要输出实体之间的关系（关系由其它阶段处理）
        - 无合适事实时输出 {"facts": []}

        **⚠️ 输出格式（必须严格遵守）**：
        - 必须输出 JSON 对象，以 { 开头，以 } 结尾
        - 正确示例：{"facts":[{"entity":"CE8850","entity_type":"device_model","attribute":"cooling","value":"front-to-back","evidence":"supports front-to-back airflow","confidence":0.9}]}
        - 空结果：{"facts":[]}
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"facts":{"type":"array","items":{"type":"object","properties":{"entity":{"type":"string"},"entity_type":{"type":"string"},"attribute":{"type":"string"},"value":{"type":"string"},"evidence":{"type":"string"},"confidence":{"type":"number","minimum":0.0,"maximum":1.0}},"required":["entity","attribute","value","confidence"],"additionalProperties":false}}},"required":["facts"],"additionalProperties":false}'

    # 仅 vendor pack 注册；其它域无此模板 → ontology_induction 提交失败并静默 noop。
    # 输入键须与 OntologyInductor.induce 一致：$existing_types / $untyped_entities。
    - template_key: mining-ontology-induction
      template_version: "1"
      purpose: "从人工确认的暂无类型实体归纳厂商技术文档本体类型候选"
      system_prompt: >
        你是厂商技术文档知识库的本体归纳助手。给定一批已被人工确认为重要、
        但当前本体没有合适类型的实体，请将语义真正相近的实体归为一类，
        并提出简洁的类型名与定义。禁止臆造实体；证据不足时可返回空列表。
      user_prompt_template: >
        以下实体已被评审确认为重要概念，但当前本体尚无合适类型。

        当前已有本体类型（供参考；仅在真正等价时才复用其名称）：
        $existing_types

        暂无类型实体（每行一条，可能含建议类型与原文摘录）：
        $untyped_entities

        请输出 JSON 对象，字段 new_types。每项为：
        {type_name, definition, examples, members, layer}

        规则：
        - 只把语义真正相近的实体放进同一类型；不要硬凑大杂烩类型
        - members 必须从上方实体列表原样抄写规范名（大小写可随列表）
        - type_name 优先英文 snake_case（如 optical_transceiver、ha_feature）
        - 厂商文档常见缺口类型示例（仅作启发，非强制）：board_slot、license_item、
          upgrade_constraint、compatibility_matrix_entry、cli_mode、vpn_instance
        - 若实体其实属于已有类型（如 device_model / feature / command / alarm_code /
          protocol / optical_module / software_version），优先复用已有 type_name，
          不要另起近义名
        - layer 默认 "concept"；仅当类型明显表示实例级实体时用其它 layer
        - 证据太弱时返回 {"new_types": []}

        **⚠️ 输出格式（必须严格遵守）**：
        - 必须输出 JSON 对象，以 { 开头，以 } 结尾
        - 正确示例：{"new_types":[{"type_name":"license_item","definition":"产品授权/License 条目","examples":["VXLAN License"],"members":["VXLAN License"],"layer":"concept"}]}
        - 空结果：{"new_types":[]}
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"new_types":{"type":"array","items":{"type":"object","properties":{"type_name":{"type":"string"},"definition":{"type":"string"},"examples":{"type":"array","items":{"type":"string"}},"members":{"type":"array","items":{"type":"string"}},"layer":{"type":"string"}},"required":["type_name","members"],"additionalProperties":false}}},"required":["new_types"],"additionalProperties":false}'

  eval_questions:
    - id: q001
      question: "CE8850 的散热风道有哪些方向，部署时要注意什么？"
      expected_entities: ["CE8850"]
      expected_evidence_contains: ["散热", "风道"]
