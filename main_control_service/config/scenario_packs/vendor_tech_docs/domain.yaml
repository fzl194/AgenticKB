      expected_entities: ["OSPF"]
      expected_evidence_contains: ["OSPF", "stub"]
      expected_semantic_role: procedure_step
      notes: "协议配置类"
    - id: q004
      question: "AP 无法注册到 WLAN AC 怎么排查？"
      expected_entities: ["AirEngine", "WLAN AC"]
      expected_evidence_contains: ["注册", "AC"]
      expected_semantic_role: troubleshooting_step
      notes: "WLAN 排障类"
    - id: q005
      question: "从 V300R024 升级到 V300R025 有哪些注意事项？"
      expected_entities: []
      expected_evidence_contains: ["升级"]
      expected_semantic_role: procedure_step
