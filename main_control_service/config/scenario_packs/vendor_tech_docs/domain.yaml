# ===========================================================================
# SERVING — query understanding + route policy for product-manual Q&A
# ===========================================================================

serving:
  facet_filter:
    enabled: true
    mode: permissive
    keys:
      - series
      - version
    entity_types:
      series:
        - device_series
      version:
        - software_version

  # Static seed for synonym_expand (4.1); merged with mined asset_synonym_pairs.
  # Keys are matched case-insensitively. Manual entries win on collision order.
  synonym_dict:
    bfd:
      - Bidirectional Forwarding Detection
    "bidirectional forwarding detection":
      - BFD
    m-lag:
      - Multichassis Link Aggregation Group
      - Multi-Chassis Link Aggregation Group
    vxlan:
      - Virtual Extensible LAN
    evpn:
      - Ethernet VPN
      - BGP EVPN

  extractor_rules:
    - pattern: "\\b(CE\\d{4,5}(?:E)?|XH\\d{4,5}|NE\\d{4,5}(?:E)?|S\\d{4,5}(?:[A-Z]+)?|AirEngine(?:\\s*X?\\d{3,4})?|AC\\d{4}S?)\\b"
      entity_type: device_series
    - pattern: "\\b(M-LAG|VXLAN|EVPN|BGP|OSPF|IS-IS|BFD|VRRP|Stack|CSS|TRILL|SRv6|NetStream|sFlow|CAPWAP|OFDMA|MU-MIMO)\\b"
      entity_type: feature
    - pattern: "\\b(SFP\\+?|SFP28|QSFP\\+?|QSFP28|QSFP56|QSFP-DD|OSFP|CFP2?)\\b"
      entity_type: optical_module
    - pattern: "\\bV\\d{3}R\\d{3}C\\d{2}(?:SPC\\d+)?\\b"
      entity_type: software_version

  query_understanding:
    command_regex: "(?i)\\b(display|undo|reset|ping|tracert|save)\\s+([\\w/-]+)"
    op_map:
      查询: DISPLAY
      查看: DISPLAY
      显示: DISPLAY
      配置: CONFIG
      设置: CONFIG
      安装: INSTALL
      升级: UPGRADE
      迁移: MIGRATE
      排查: TROUBLESHOOTING
      告警: ALARM
    network_elements:
      - CE5800
      - CE6800
      - CE8800
      - CE9800
      - CE12800
      - CE16800
      - XH9000
      - XH16800
      - NE40E
      - NE8000
      - NE9000
      - AirEngine
      - WLAN AC
      - NCE-Campus
      - NCE-Fabric
    products:
      - CloudEngine
      - NetEngine
      - AirEngine
      - CloudCampus
      - CloudFabric
      - iMaster
      - SD-WAN
      - SASE
      - VRP

  route_policy:
    default:
      lexical_bm25:
        weight: 1.0
        top_k: 50
      entity_exact:
        weight: 1.1
        top_k: 25
      dense_vector:
        weight: 0.9
        top_k: 50
      entity_graph:
        weight: 1.0
        top_k: 25

    command_usage:
      entity_exact:
        weight: 1.5
        top_k: 25
      lexical_bm25:
        weight: 1.1
        top_k: 50
      dense_vector:
        weight: 0.5
        top_k: 25
      entity_graph:
        weight: 0.7
        top_k: 20

    concept_lookup:
      dense_vector:
        weight: 1.2
        top_k: 60
