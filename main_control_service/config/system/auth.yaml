# Authentication configuration. deploy-server.sh creates strong values on the
# deployment host before the first startup; generated values must not be committed.
enabled: true
jwt_secret: ""
token_ttl_seconds: 43200
internal_verify_secret: ""
bootstrap:
  # First deployment generates this once, then flips the flag to false.
  # Set to false before deployment to opt out of automatic bootstrap creation.
  initialize_on_deploy: true
  admin_password: ""
