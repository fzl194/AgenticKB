embedding:
  base_url: "http://host.docker.internal:18081/v1/embeddings"
  api_key: "local-tei-no-auth"
  model: "Qwen3-Embedding-0.6B"
  dimensions: 1024
  # BUG-01：embedding 网关是否接受请求体里的 dimensions 字段。
  # true（默认）：智谱 embedding-3 等需要 dimensions 压维度，照常下发；
  # false：MaaS/bge-m3 等网关（Pydantic extra_forbidden，收到该字段即
  #        HTTP 200 + 空 data → 0 向量死信）绝不下发，dimensions 仅用于
  #        worker 本地校验返回向量维度。
  send_dimensions: true
  timeout: 60
  bypass_proxy: false
  headers: {}
rerank:
  base_url: "http://host.docker.internal:18083/rerank"
  api_key: "local-vllm-no-auth"
  model: "/models/Qwen3-Reranker-0.6B"
  timeout: 60
  bypass_proxy: false
  headers: {}
worker:
  concurrency: 6
  poll_interval: 1.0
persist_writer:
  queue_size: 10000
  batch_size: 20
  flush_interval: 0.5
  writer_count: 1
task:
  default_max_attempts: 3
  retry_backoff_base: 8.0
  retry_backoff_max: 120.0
  execute_timeout: 60
  lease_duration: 300
  lease_recovery_interval: 30.0
template:
  cache_ttl: 300.0
