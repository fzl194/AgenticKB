# Object Store configuration (M1.1, WP1A).
#
# Selects the ObjectStorePort adapter: "fake" (filesystem, tests/local dev) or
# "minio" (production). Bucket names are formed as "{bucket_prefix}{artifact_class}"
# per SRS §8.1 (e.g. agentickb-dev-source).
#
# References:
# - SRS §C00 (MinIO Object Storage Foundation), §8.1 (bucket/key strategy)
# - ADR-0003 D-002 (dual adapter), D-006 (guarded MinIO), D-020 (location)
#
# WARNING: credentials are managed by the Secret system / env, NOT committed.
# The minio section below is an EXAMPLE shape only — replace placeholders via
# secret injection and never commit real access_key / secret_key values.

object_store:
  # Adapter selection: "fake" | "minio".
  provider: fake

  # Shared: concatenated with artifact_class to form bucket names (SRS §8.1).
  bucket_prefix: agentickb-dev-

  # ---- fake adapter (filesystem) ----
  root_path: ./.object_store

  # ---- minio adapter (production) ----
  # Uncomment and supply via Secret injection for production.
  # provider: minio
  # endpoint: minio.local:9000
  # access_key: REPLACE_VIA_SECRET   # 凭据由 Secret 管理，勿提交真实值
  # secret_key: REPLACE_VIA_SECRET   # 凭据由 Secret 管理，勿提交真实值
  # secure: true
  # region: null
