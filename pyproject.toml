[project]
name = "cloud-core-knowledge-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
    "markdown-it-py>=3.0",
    "jinja2>=3.1",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.1",
    "pdfminer.six>=20231228",
    "python-docx>=1.1",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "fastmcp>=2.0",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "xlwt>=1.3,<2"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "performance: controlled mining throughput and memory-bound acceptance tests",
    "postgres: guarded tests that require disposable PostgreSQL databases",
]

[tool.setuptools.packages.find]
include = ["agent_serving*", "knowledge_mining*", "llm_service*", "main_control_service*"]
